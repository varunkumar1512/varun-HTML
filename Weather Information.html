<!DOCTYPE html>
<html>
<head>
    <title>Weather Report</title>

    <style>
        body {
            font-family: Arial;
            background: lightblue;
            text-align: center;
        }

        .container {
            background: white;
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 15px;
        }

        input {
            padding: 10px;
            width: 80%;
        }

        button {
            padding: 10px;
            background: rgb(141, 213, 255);
            color: rgb(34, 23, 23);
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Weather Report</h1>

        <input type="text" id="city"
        placeholder="Enter City Name">

        <br><br>

        <button onclick="getWeather()">Check Weather</button>

        <div id="result"></div>

    </div>

    <script>

        function getWeather() {

            var city = document.getElementById("city").value;

            if (city == "") {
                alert("Please enter city name");
                return;
            }

            var url = "https://wttr.in/" + encodeURIComponent(city) + "?format=j1";

            fetch(url)
            .then(response => response.json())
            .then(data => {

                var weather = data.current_condition[0];

                document.getElementById("result").innerHTML =
                    "<h2>" + city + "</h2>" +
                    "<h1>" + weather.temp_C + " °C</h1>" +
                    "<p>Weather: " + weather.weatherDesc[0].value + "</p>" +
                    "<p>Humidity: " + weather.humidity + "%</p>" +
                    "<p>Wind Speed: " + weather.windspeedKmph + " km/h</p>";

            })

            .catch(error => {
                document.getElementById("result").innerHTML =
                    "Unable to get weather. Try again.";
            });

        }

    </script>

</body>
</html>
